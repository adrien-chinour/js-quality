name: release

# Publishes the package to npm when a version tag is pushed (`git tag v0.2.0 && git push origin v0.2.0`).
# Authentication: npm trusted publishing (OIDC), no token. The provenance statement is added by npm.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in a publishing job: nothing restored that another run could have written.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - run: vp run qa
      - run: vp pm pack --pack-destination "$RUNNER_TEMP"
      # npm, not pnpm: npm 11.5+ handles trusted publishing. It runs outside the project, whose devEngines
      # require pnpm, and publishes the tarball built above.
      - name: Publish
        working-directory: ${{ runner.temp }}
        run: npm publish ./*.tgz --access public
